# Copy this file to config.toml and fill in the [telegram] section.
# Every number below is a rule the bot follows. Change them here, not in code.

[telegram]
bot_token = ""   # from @BotFather (or set env TELEGRAM_BOT_TOKEN)
chat_id = ""     # run: python main.py --find-chat-id   (or set env TELEGRAM_CHAT_ID)

[account]
starting_balance = 1000      # paper account, USD
risk_per_trade_pct = 2.0     # max loss per trade if the stop hits (2% of $1000 = $20)
default_leverage = 5
max_leverage = 10
max_open_positions = 3       # pending entries + open trades
daily_loss_limit_pct = 6.0   # no new alerts for the rest of the UTC day after this
min_order_usd = 10           # Hyperliquid minimum order value
maker_fee_pct = 0.015        # limit entry
taker_fee_pct = 0.045        # exits (assumed market, conservative)

[scan]
interval_seconds = 60        # full market scan
price_check_seconds = 15     # stop / take-profit checks on open trades
min_score = 70               # alert threshold
min_day_volume_usd = 5_000_000
max_coins = 50               # most-traded coins scanned
max_candle_fetches_per_scan = 25  # stays inside Hyperliquid's rate limit
allow_shorts = true
cooldown_hours = 6           # don't re-alert the same coin + side within this window

[signals]
# Breakouts are detected on 15m candles, so a move is caught within minutes of the candle closing.
breakout_lookback_candles = 96   # 15m candles = 24h range
volume_period = 20
volume_multiple = 2.0        # breakout candle volume vs. 20-candle average
oi_lookback_hours = 4
oi_rise_pct = 10.0
long_funding_max = 0.0001    # 0.01%/h  - long OI signal needs funding at or below this
short_funding_min = 0.0003   # 0.03%/h  - short OI signal needs crowded longs
block_long_funding = 0.0005  # 0.05%/h  - never long above this
block_short_funding = -0.0005
max_24h_move_pct = 30.0      # never chase a coin already up (or down) this much

[btc]
# BTC drives the market: these are hard gates, not just score points.
require_trend = true         # longs only when BTC 4h closes above its 20-period average, shorts only below
sma_period = 20
max_against_1h_pct = 1.5     # no longs while BTC is down this much in the last hour (no shorts if up)
max_against_4h_pct = 3.0     # same over the last 4 hours
warn_open_trades_1h_pct = 1.5  # message you if BTC moves this much against a trade you took
correlation_hours = 48       # shown on alerts: how closely the coin has tracked BTC

[weights]
breakout = 30
open_interest = 25
catalyst = 25
btc_trend = 20
smart_money = 25             # 2+ tracked top traders positioned the same way

[smart_money]
# Follow the most profitable Hyperliquid accounts (public on-chain) - the same idea as copy trading.
enabled = true
top_n = 30                   # accounts followed, ranked by 30-day P&L
min_account_value = 100_000
min_month_pnl = 50_000
min_month_roi_pct = 15
max_month_volume_to_account = 300  # skips market makers / HFT bots
refresh_hours = 6            # re-pick the list
poll_seconds = 60
min_position_usd = 50_000    # ignore small positions
consensus_traders = 2        # this many on the same side adds the smart_money score
alert_on_open = true         # message you the moment a followed trader opens or flips a position

[fib]
# Entries, stops and targets come from the latest 15m swing when there is a clean one.
enabled = true
window_candles = 96          # 15m candles searched for the swing (24h)
recent_candles = 24          # the swing high (low for shorts) must be within the last 6h
min_move_pct = 3.0           # ignore swings smaller than this
entry_level = 0.618          # buy the pullback to this retracement
stop_level = 0.786           # stop just beyond this retracement
stop_buffer_pct = 0.2        # extra room beyond the stop level
tp1_level = 0.0              # 0 = retest of the swing high (low for shorts)
tp2_level = -0.272           # 1.272 extension
min_stop_pct = 1.0           # widen stops tighter than this (15m noise)
min_reward_risk = 1.5        # skip if TP1 is less than 1.5x the risk away
fallback_to_atr = true       # no clean swing -> use the ATR plan below instead of skipping

[plan]
atr_period = 14              # 1h ATR, used for the fallback plan and the trailing stop
entry_pullback_atr = 0.5     # fallback plan: limit entry this many ATRs better than current price
stop_atr = 1.5
max_stop_pct = 10.0          # skip setups that need a wider stop than this
tp1_r = 2.0                  # fallback plan: TP1 at 2x the stop distance
tp2_r = 4.0
tp1_close_pct = 50           # % of the position sold at TP1 (stop then moves to entry)
tp2_close_pct = 30
trail_atr = 1.0              # remainder trails this many ATRs behind the best price
entry_expiry_hours = 6       # cancel the limit if not filled (fib pullbacks can take a few hours)
time_stop_hours = 24         # close if TP1 not hit by then
max_hold_hours = 72

[analyst]
# Claude reads each alert, searches the latest news on the coin and writes a short take with the risks.
# Needs an Anthropic API key (console.anthropic.com) - roughly a few cents per alert.
enabled = true
api_key = ""                 # or env ANTHROPIC_API_KEY
model = "claude-opus-5-5"
effort = "medium"
max_searches = 3

[backtest]
days = 50                    # Hyperliquid serves ~5000 candles per coin: 50 days of 15m
coins = 25                   # most-traded coins tested
min_score = 50               # history has no news/OI/top-trader data, so only price signals (breakout 30 + BTC 20) count
cache_dir = "backtest_cache"

[news]
catalyst_window_hours = 2
refresh_seconds = 600
binance_listings = true
upbit_listings = true
cryptopanic_token = ""       # optional free key: cryptopanic.com/developers/api (or env CRYPTOPANIC_TOKEN)
cryptopanic_url = "https://cryptopanic.com/api/developer/v2/posts/"
cryptopanic_min_net_votes = 3
